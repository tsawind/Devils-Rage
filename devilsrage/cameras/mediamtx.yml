# MediaMTX for the Devil's Rage cameras. Only WebRTC is on; every other protocol is off.
logLevel: info
api: no
metrics: no
pprof: no
playback: no
rtsp: no
rtmp: no
hls: no
srt: no
# MoQ (Media over QUIC) is on by default in newer MediaMTX; we don't use it.
moq: no

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
# Video goes over port 8189: UDP first, TCP when a home network blocks UDP.
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Find the server's public address so browsers can reach it.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302
webrtcIPsFromInterfaces: no
# The server's public name is set by MTX_WEBRTCADDITIONALHOSTS in ~/devilsrage-cameras/.env.

# The mapper decides who may publish or watch (members; guests only where a camera allows
# their link). The browser sends its pass as "Authorization: Bearer" (and ?pass=); MediaMTX
# hands both to the mapper.
authMethod: http
# authHTTPAddress comes from MTX_AUTHHTTPADDRESS in ~/devilsrage-cameras/.env (the mapper's URL).
authHTTPExclude: []

pathDefaults:
  # Nothing is recorded on the server; cameras record their own short clips.
  record: no
  overridePublisher: yes

paths:
  # Every camera is cam-<id>; anything else is refused by the mapper anyway.
  "~^cam-[a-z0-9]{20,40}$": {}
